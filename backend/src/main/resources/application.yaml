spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/management
    username: root # 用户名
    password: ${PM_DB_PASSWORD} # 密码
    driver-class-name: com.mysql.cj.jdbc.Driver # MyBatis服务

    type: com.alibaba.druid.pool.DruidDataSource  # 默认Hikari,流行Druid
    druid:
      log-abandoned: true # Druid日志

  servlet:
    multipart:
      max-file-size: 10MB # 最大单个文件大小,默认1MB
      max-request-size: 100MB # 最大请求大小(包括所有文件和表单数据),默认10MB
server:
    servlet:
      context-path: /api
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl # 可选,数据库日志
    map-underscore-to-camel-case: true # 自动根据驼峰命名Mapper文件接收数据库数据
  # 阿里云OSS参数配置
#aliyun:
#  oss:
#    region: cn-beijing  # 区域
#    bucketName: rja7710 # Bucket名称
#    endpoint: https://rja7710.oss-cn-beijing.aliyuncs.com  # Endpoint
jwt:
  secret: ${PM_JWT_SECRET:dev-only-32-bytes-secret-change-me}